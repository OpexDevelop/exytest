name: Convert MERT-v2 FP16

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Swap Space (10GB)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          
          # 1. Ставим актуальный litert-torch и transformers
          pip install litert-torch transformers einops safetensors soundfile
          
          # 2. Подтягиваем torchaudio СТРОГО той же версии, что подтянул torch
          TORCH_VER=$(python -c "import torch; print(torch.__version__.split('+')[0])")
          echo "Detected PyTorch version: $TORCH_VER"
          pip install "torchaudio==$TORCH_VER" --no-deps

      - name: Run Conversion
        run: python convert_mert_v2.py

      - name: Upload TFLite Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mert-v2-fp-tflite
          path: mert_v2_30s.tflite
          retention-days: 5

