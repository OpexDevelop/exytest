name: Convert MERT-v2-FullSong

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Swap Space (16GB)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install litert-torch transformers einops safetensors soundfile

      - name: Run FullSong Conversion
        run: python convert_mert_v2.py

      - name: Upload TFLite Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mert-v2-backbone-tflite
          path: mert_v2_backbone.tflite
          retention-days: 5

