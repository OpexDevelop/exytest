name: Convert MERT-v2 FP16

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Swap Space (10GB)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install transformers einops safetensors soundfile ai-edge-torch

      - name: Run Conversion
        run: python convert_mert_v2.py

      - name: Upload FP16 TFLite
        uses: actions/upload-artifact@v4
        with:
          name: mert-v2-fp16
          path: mert_v2_fp16.tflite
          retention-days: 5

