name: Convert MERT-330M to TFLite

on:
  workflow_dispatch: # Запуск кнопкой из интерфейса GitHub

jobs:
  convert:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install transformers einops ai-edge-torch

      - name: Run MERT-330M Conversion
        run: python convert_mert_330m.py

      - name: Upload TFLite Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mert-330m-tflite
          path: mert_330m_10s.tflite
          retention-days: 5
