plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.litertprobe'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.litertprobe"
        minSdk 31
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters.add("arm64-v8a")
        }
        packaging {
            jniLibs {
                useLegacyPackaging = true
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    androidResources {
        noCompress 'tflite'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // LiteRT ядро и нативный рантайм Samsung NPU Exynos LiteCore
    implementation 'com.google.ai.edge.litert:litert:2.3.0'
    implementation 'com.google.ai.edge.litert:litert-gpu:2.3.0'
    implementation 'com.google.ai.edge.litert:litert-npu-runtime-samsung:2.3.0'
}

